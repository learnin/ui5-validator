specVersion: '3.0'
type: application
metadata:
  name: ui5-lib-learnin.ui5.validator-example
resources:
  configuration:
    paths:
      webapp: webapp
framework:
  name: OpenUI5
  version: 1.96.37
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.table
    - name: sap.uxap
    - name: themelib_sap_fiori_3
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        targetBrowsers: "defaults"
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        targetBrowsers: "defaults"
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://openui5.hana.ondemand.com
          version: 1.96.37
